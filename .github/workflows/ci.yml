name: Test and bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Check syntax and placement behavior
        run: |
          node --check gitify/contents/code/main.js
          bash -n scripts/install.sh scripts/bundle.sh
          python3 -m py_compile scripts/test-live.py
          npm test
      - name: Bundle KWin script
        run: npm run bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitify-kwin-script
          path: dist/gitify.kwinscript
