name: Test and bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check syntax and placement behavior
        run: |
          node --check gitify/contents/code/main.js
          bash -n scripts/install.sh scripts/bundle.sh
          python3 -m py_compile scripts/test-live.py
          npm test
      - name: Bundle KWin script
        run: npm run bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gitify-kwin-script
          path: dist/gitify.kwinscript
