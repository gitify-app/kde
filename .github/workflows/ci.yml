name: Test and bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Lint
        run: pnpm lint:ci
      - name: Check syntax and placement behavior
        run: |
          node --check gitify/contents/code/main.js
          bash -n scripts/install.sh scripts/bundle.sh
          python3 -m py_compile scripts/test-live.py
          pnpm test
      - name: Bundle KWin script
        run: pnpm bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gitify-kwin-script
          path: dist/gitify.kwinscript

  lint-actions:
    name: Lint GitHub Actions [actionlint]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/

      - name: GitHub Actions linter
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Install GitHub Actions lockfile verifier
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
        env:
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          GH_ACTIONS_LOCK_VERSION: v0.5.1
          GH_TOKEN: ${{ github.token }}

      - name: Verify GitHub Actions lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
